TAXONOMY_ID = "9606"
AGE_OR_AGE_RANGE = "53-81"
GENDER = "Male/Female"
HUMAN_SMOKING_STATUS = "Former/Current"

[COLLECTION]
COLLECTION_SUMMARY = "Blood samples were collected from all patients enrolled in the protocol before diagnosis (>6 months prior to surgery, pre-diagnostic). Additional blood samples were collected from some of the lung cancer patients, at-diagnosis (at diagnosis) and post-treatment (after surgery). All but one patient had their “at-diagnosis” sample collected before surgery, usually within days prior to surgery, likely on their pre-operation visit. Surgery was usually performed within 1–3 months of diagnosis. Diagnosis was made by biopsy and/or surgery with all tissue diagnoses confirmed by pathology."
SAMPLE_TYPE = "Blood"
BLOOD_SERUM_OR_PLASMA = "Serum"

[TREATMENT]
TREATMENT_SUMMARY = "The NYU Lung Cancer Biomarker Center performs low-dose CT-scan screening for high-risk smokers as part of the National Cancer Institute’s Early Detection Research Network Program (EDRN). Lung cancer cases for this study were confirmed by pathology (Table 1). Patients with benign nodules were those with stable nodules or ground glass opacity (GGO) over at least two year period with annual CT scans performed. Post-diagnosis samples were collected at least one month post-surgery. Selection of cases was performed by NYU and the blinded serum samples were sent to University of California, Davis Medical Center (UCDMC) for analysis. None of the study subjects had previous cancer or chemotherapy. All subjects had blood drawn by EDRN protocol, performed spirometry according to ATS guidelines,and answered questionnaires with smoking and occupational history."

[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "1. Switch on bath to pre-cool at –20°C (±2°C validity temperature range) 2. Gently rotate or aspirate the blood samples for about 10s to obtain a homogenised sample. 3. Aliquot 30?l of plasma sample to a 1.0 mL extraction solution. The extraction solution has to be prechilled using the ThermoElectron Neslab RTE 740 cooling bath set to -20°C. 4. Vortex the sample for about 10s and shake for 5 min at 4°C using the Orbital Mixing Chilling/Heating Plate. If you are using more than one sample, keep the rest of the sample on ice (chilled at <0°C with sodium chloride). 5. Centrifuge samples for 2min at 14000 rcf using the centrifuge Eppendorf 5415 D. 6. Aliquot two 450?L portions of the supernatant. One for analysis and one for a backup sample. Store the backup aliquot in -20°C freezer. 7. Evaporate one 450?L aliquots of the sample in the Labconco Centrivap cold trap concentrator to complete dryness. 8. The dried aliquot is then re-suspended with 450 ?L 50% acetonitrile (degassed as given above). 9. Centrifuged for 2 min at 14000 rcf using the centrifuge Eppendorf 5415. 10. Remove supernatant to a new Eppendorf tube. 11. Evaporate the supernatant to dryness in the Labconco Centrivap cold trap concentrator. 12. Submit to derivatization."
SAMPLEPREP_PROTOCOL_FILENAME = "SOP blood-GCTOF-11082012.pdf"

