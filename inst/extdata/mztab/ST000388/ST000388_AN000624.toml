[PROJECT]
PROJECT_TITLE = "Serum phosphatidylethanolamine levels distinguish benign from malignant solitary pulmonary nodules and represent a potential diagnostic biomarker for lung cancer."
PROJECT_SUMMARY = "Recent computed tomography (CT) screening trials showed that it is effective for early detection of lung cancer, but were plagued by high false positive rates. Additional blood biomarker tests designed to complement CT screening and reduce false positive rates are highly desirable. In the current study, we expand upon our initial experimental findings as part of the discovery phase by evaluating metabolites in serum from subjects with benign or malignant SPNs using a combined approach of gas chromatography time-of-flight mass spectrometry (GC-TOFMS) and hydrophilic liquid chromatography accurate mass quadrupole time-of-flight mass spectrometry (HILIC-qTOFMS). Furthermore, we evaluated serum collected pre-diagnosis and at-diagnosis of lung cancer in addition to samples obtained post-surgical intervention from subjects with malignant SPNs (post-diagnosis). We hypothesize that our systems biology approach to identify candidate metabolomics biomarkers will ultimately lead to improved early detection of lung cancer and can be used in as a companion blood test to LDCT screening."
INSTITUTE = "University of California, Davis"
DEPARTMENT = "Genome and Biomedical Sciences Facility"
LABORATORY = "WCMC Metabolomics Core"
LAST_NAME = "Fiehn"
FIRST_NAME = "Oliver"
