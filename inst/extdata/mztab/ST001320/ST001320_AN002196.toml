[PROJECT]
PROJECT_TITLE = "GSK3 inhibits macropinocytosis and lysosomal activity through the Wnt destruction complex machinery"
PROJECT_SUMMARY = "Canonical Wnt signaling is emerging as a major regulator of endocytosis. Here we report that mutation of Axin1, a tumor-suppressor part of the β-catenin destruction complex, results in the activation of macropinocytosis in Alexander hepatocellular carcinoma (HCC) cells. Axin1 binds Glycogen Synthase Kinase 3 (GSK3), and we found that inhibition of GSK3 by Lithium chloride (LiCl), CHIR99021 or dominant-negative GSK3 triggered macropinocytosis. GSK3 inhibition caused a rapid increase in endolysosomes that was independent of new protein synthesis. GSK3 inhibition or Axin1 mutation increased lysosomal activity, which could be followed with tracers for active cathepsin D, β-glucosidase, and ovalbumin degradation. Microinjection of LiCl into the blastula cavity of Xenopus embryos caused a striking increase in dextran macropinocytosis. The effects of GSK3 inhibition on macropinocytosis and protein degradation in endolysosomes were blocked by the macropinocytosis inhibitors EIPA or IPA-2, suggesting that the increased membrane trafficking drives lysosomal activity and nutrient acquisition."
