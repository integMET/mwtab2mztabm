[COLLECTION]
COLLECTION_SUMMARY = "Extraction began by placing the 6-well dishes on ice and washing each well with 2mL of a 150 mM ammonium acetate solution (pH 7.4, 4°C). Post wash, metabolites were extracted from each well on dry ice with 500 μL of a (1:4) dH20, MeOH solution at -80°C. The samples were then incubated for 15 min at -80°C. Afterwards, the cells were scraped into solutions which were then transferred to eppitubes and spun down at 4°C for 10 min at 17,000g. The supernatants were transferred to new glass vials and dried with an EZ2-Elite lyophilizer (Genevac). These dried metabolites were then stored at -80°C until they could be run on the LC/MS."
SAMPLE_TYPE = "Cultured cells"
STORAGE_CONDITIONS = "Described in summary"

[TREATMENT]
TREATMENT_SUMMARY = "The cells were incubated with DMEM(no glucose) supplemented with 10% dialyzed FBS, 1% P/S, and 10 mM UC13-glucose with either vehicle (0.1% BSA in dH20) or wnt (100ng/mL) added. Cells were treated for either 20 min or 60 min with each treatment group having a vehicle matched time control."

[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "Extraction began by placing the 6-well dishes on ice and washing each well with 2mL of a 150 mM ammonium acetate solution (pH 7.4, 4°C). Post wash, metabolites were extracted from each well on dry ice with 500 μL of a (1:4) dH20, MeOH solution at -80°C. The samples were then incubated for 15 min at -80°C. Afterwards, the metabolite solutions were transferred to eppitubes and spun down at 4°C for 10 min at 17,000g. The supernatants were transferred to new vials and dried with an EZ2-Elite lyophilizer (Genevac). These dried metabolites were then stored at -80°C until they could be run on the LC/MS."
