[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "A 50 µL aliquot of plasma/serum sample was spiked with two internal standard solutions (10 µl p-chlorophenylalanine in water, 0.1 mg/mL; 10 µL heptadecanoic acid in methanol, 1 mg/mL). The mixed solution was extracted with 175 µL of methanol: chloroform (3:1) and vortexed for 30 seconds. After storing for 10 minutes at –20°C, the samples were centrifuged at 13,000 rpm for 10 minutes. An aliquot of 200 µL supernatant was transferred to a glass sampling vial to vacuum dry at room temperature. The residue was derivatized using a two-step procedure. First, 50 µL methoxyamine (15 mg/mL in pyridine) was added to the vial and kept at 30°C for 90 minutes. After adding 10 µL C10-C40 (all even alkanes, 12.5 µg/mL) as retention index, 50 µL N,O-bis-(trimetylsilyl) trifluoroacetamide (BSTFA) (1% trimethylchlorosilane, TMCS) was added to the samples, before being derivatized at 70°C for 60 minutes. Each 1 µL aliquot of the derivatized solution was injected in splitless mode into an Agilent 6890N gas chromatography coupled with a Pegasus HT time-of-flight mass spectrometry (Leco Co., St. Joseph, MI, USA). To minimize systematic analytical deviations, each control sample was separated by 1 or 2 breast cancer samples. Breast cancer samples from different stages were also run evenly in the whole experiment. Separation was achieved on an Rxi-5 ms capillary column (Crossbond ® 5% diphenyl/95% dimethyl polysiloxane, Restek, PA, USA), with helium as the carrier gas at a constant flow rate of 1.0 mL/min. The temperatures of injection, transfer interface, and ion source were set to 260, 260, and 210°C, respectively. The GC temperature programming was set to 2 min isothermal heating at 80°C, followed by 10°C/min oven temperature ramped to 220°C, 5°C/min to 240°C, and 25°C/min to 290°C, and a final eight minute maintenance at 290°C. Electron impact ionization (70 eV) at full scan mode (m/z 40–600) was used, with an acquisition rate of 20 spectra/second in the TOFMS setting. The data generated in the GC-TOFMS instrument were analyzed by the ChromaTOF software (v4.33, Leco Co, CA, USA). Using the statistic component, the aligned comma separated value (CSV) file can be obtained with sample information, peak information and peak intensity. Peak areas of unique mass were normalized to the internal standard. Compound identification was performed by comparing the mass fragments with NIST 05 Standard mass spectral databases in NIST MS search 2.0 (NIST,Gaithersburg, MD, USA) software with a similarity of more than 70% and reference standards (with retention time, or retention index if available in the library, as another parameter). Internal standards and any known artificial peaks, such as peaks caused by noise, column bleed and BSTFA derivatization procedure, were removed from the dataset before statistical analysis."

