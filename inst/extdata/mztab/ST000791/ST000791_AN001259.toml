[PROJECT]
PROJECT_TITLE = "Mayo Pilot and Feasibility: Identifying metabolic adaptations characteristic of multiple myeloma cells via mass spectrometry-based metabolite profiling"
PROJECT_SUMMARY = "Multiple myeloma (MM) is a clonal plasma cell malignancy that remains incurable in most afflicted patients. It can be preceded by an asymptomatic, premalignant stage known as smoldering multiple myeloma (SMM) that does not require therapy but has an increased life-long risk of progression to MM. However, one-third of SMM patients are “high risk” for imminent progression to MM within two years of diagnosis compared to the remainder of SMM patients who continue on an indolent asymptomatic course for several years. The diagnosis of MM cannot be made until they experience overt end-organ damage such as renal failure, lytic bone destruction, anemia and hypercalcemia. Currently, we lack sensitive biomarkers that can identify all SMM patients at high risk of progression to MM. Being able to identify high risk SMM patients could allow us to initiate systemic chemotherapy before they progress to MM. Cancer cells undergo distinct metabolic adaptations to meet the augmented cellular demand for energy and nutrients created by their increased rates of cellular proliferation. The presence of an altered cellular metabolism in clonal PCs from MM patients and its role as an essential factor in the progression of SMM to MM is unknown. We hypothesize that the clonal PCs in high risk SMM patients likely have an altered metabolic phenotype similar to those present in MM patients but different when compared to clonal PCs in the remainder of the SMM patients whose clinical course remains indolent. Thus, two specific aims are proposed in this study: Aim 1 will verify if there are differences in the regulation of the metabolic pathways in clonal PCs from MM patients compared to normal PCs from healthy patients; Aim 2 will assess whether the clonal PCs from high risk SMM patients bear a distinct metabolic phenotype compared to clonal PCs from standard risk SMM patients."
