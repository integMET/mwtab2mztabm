STUDY_TITLE = "Identifying metabolic adaptations characteristic of multiple myeloma cells via amino acids concentrations from bone marrow plasma"
STUDY_SUMMARY = "Will be assessing the targeted amino acids concentrations of high risk versus low risk smoldering myeloma patients based on peripheral blood plasma and bone marrow plasma."
