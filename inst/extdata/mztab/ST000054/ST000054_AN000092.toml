ANALYSIS_ID = "AN000092"
VERSION = "1"
CREATED_ON = "2016-09-17"

[PROJECT]
PROJECT_TITLE = "Metabolic Microenvironments in Normal Breast and Breast Cancer"
PROJECT_TYPE = "Broad Spectrum"
PROJECT_SUMMARY = "Breast cancers evolve and acquire adaptive changes while in active with the surrounding host normal tissue. It is important to understand the and metabolomic changes in breast microenvironment at various stages of cancer and progression (i.e., normal breast, DCIS, benign disease and invasive Since intrinsic breast cancer subtypes are very distinct from each other in of clinical features as well as the genomic profiling, these subtypes may also distinct metabolic microenvironment signatures."
INSTITUTE = "University of North Carolina at Chapel Hill"
DEPARTMENT = "Epidemiology"
LABORATORY = "Troester Laboratory"
LAST_NAME = "Troester"
FIRST_NAME = "Melissa"
ADDRESS = "University of North Carolina at Chapel Hill Chapel Hill, NC 27599"
EMAIL = "troester@unc.edu"
PHONE = "919-966-7408"

[STUDY]
STUDY_TITLE = "Metabolic Microenvironments in Normal Breast and Breast Cancer (MS analysis)"
STUDY_TYPE = "Metabolomic analysis of normal breast tissue"
STUDY_SUMMARY = "The purpose of this study was to understand the metabolomic changes in a breast microenvironment at various stages of cancer development and progression (i.e. breast, DCIS, and invasive cancer). The goal of this metabolomics pilot and study was to apply a broad spectrum GC-MS metabolomics method to determine changes in normal tissue of women with cancer correlate with progression and or subtype of the disease."
INSTITUTE = "RTI International"
DEPARTMENT = "Systems and Translational Sciences"
LABORATORY = "NIH Eastern Regional Comprehensive Metabolomics Resource Core (RTI RCMRC)"
LAST_NAME = "Sumner"
FIRST_NAME = "Susan"
ADDRESS = "3040 E. Cornwallis Road, Research Triangle Park, NC 27709, USA"
EMAIL = "ssumner@rti.org"
PHONE = "919-541-7479"
NUM_GROUPS = "8"
TOTAL_SUBJECTS = "192"
STUDY_COMMENTS = "sample preparation and analysis randomized with data collection over multiple"

[SUBJECT]
SUBJECT_TYPE = "Human"
SUBJECT_SPECIES = "Homo sapiens"
TAXONOMY_ID = "9606"
GENDER = "female"
SPECIES_GROUP = "Human"

[COLLECTION]
COLLECTION_SUMMARY = "Cancer-adjacent, normal breast tissue was collected"
COLLECTION_PROTOCOL_ID = "UNC-CH IRB #09-1436"
COLLECTION_PROTOCOL_FILENAME = "Normal_Breast_Study"
COLLECTION_PROTOCOL_COMMENTS = "Breast tissue samples were collected from patients in the UNC hospital system the Normal Breast Study (IRB #09-1436). Normal breast tissue from patients with mammoplasty, DCIS and invasive breast cancer were analyzed in this study. samples 2-4 cm away from the tumor were collected and stored at -80°C after Samples were cut on dry ice to yield a metabolomics sample comprising 50-120 mg The tissue was placed in a tissue homogenization tube with ceramic beads and at -80°C. The samples were delivered to the RTI RCMRC and stored at -80°C."
SAMPLE_TYPE = "tissue"
COLLECTION_METHOD = "tissue collected during surgery"
COLLECTION_LOCATION = "breast microenvironment"
COLLECTION_FREQUENCY = "one time collection"
VOLUMEORAMOUNT_COLLECTED = "50 - 120mg"
STORAGE_CONDITIONS = "-80 C"
TISSUE_CELL_IDENTIFICATION = "breast"
TISSUE_CELL_QUANTITY_TAKEN = "50mg"

[TREATMENT]
TREATMENT_SUMMARY = "Stages of breast cancer progression and different subtypes compared to a control"
TREATMENT_PROTOCOL_COMMENTS = "DCIS, Luminal A, Luminal B, HER2, Basal, Reduction, Total Pool1 (equal mix of HER2, LumA, LumB, Reduction, and Basal pool samples),Total Pool2 (unequal mix DCIS, HER2, LumA, LumB, Reduction, and Basal pool samples)"

[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "Breast tissue samples were homogenized in 3:3:2 at a concentration of 100 mg/mL. Samples dried and extracted into 50% Sample dried and aliquot taken for NMR. Sample returned and extract processed GC/MS analysis. Samples were derivatized using 2 step derivatization method with methoxy amine followed by TMS derivatization with MSTFA)."
SAMPLEPREP_PROTOCOL_FILENAME = "RTI_MT_Breast_Tissue_Procedures_GC-TOF-MS.docx"
PROCESSING_METHOD = "Homogenization and Solvent Removal with SpeedVac"
PROCESSING_STORAGE_CONDITIONS = "4°C"
EXTRACTION_METHOD = "3:3:2 (acetonitrile:isopropanol:water) and then 50% Acetonitrile"
EXTRACT_STORAGE = "-80°C"
SAMPLE_RESUSPENSION = "resuspended in D2O + Chenomix ISTD solution"
SAMPLE_DERIVATIZATION = "Methoximation with methoxy amine at 40 mg/ml in pyridine followed by TMS with MSTFA"
SAMPLE_SPIKING = "FAMES (C8-C30) added to MSTFA as retention time markers"

[CHROMATOGRAPHY]
CHROMATOGRAPHY_SUMMARY = "GC/MS analysis is based on Oliver Fiehn methods"
CHROMATOGRAPHY_TYPE = "GC"
INSTRUMENT_NAME = "Leco Pegasus 4D GC"
COLUMN_NAME = "Restek Rtx-5Sil MS (30 x 0.25mm, 0.25um)"
COLUMN_PRESSURE = "10.4 psi"
COLUMN_TEMPERATURE = "50C(0.5 min)-330C(@20C/min)-330C(5 min)"
FLOW_GRADIENT = "constant flow"
FLOW_RATE = "1.0 mL/min"
INJECTION_TEMPERATURE = "250C"
RETENTION_INDEX = "FAMEs markers (C8-C30)"
RETENTION_TIME = "FAMEs markers (C8-C30)"
ANALYTICAL_TIME = "20 minutes"
OVEN_TEMPERATURE = "50C(0.5 min)-330C(@20C/min)-330C(5 min)"
TRANSFERLINE_TEMPERATURE = "280C"
SAMPLE_SYRINGE_SIZE = "10 L"

[ANALYSIS]
ANALYSIS_TYPE = "MS"
LABORATORY_NAME = "Eastern RCMRC (RTI)"
ACQUISITION_DATE = "02/11/14-02/19/2014"
SOFTWARE_VERSION = "Chromatof 4.50.8.0"
OPERATOR_NAME = "James Carlson"
