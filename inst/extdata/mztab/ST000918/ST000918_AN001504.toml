CREATED_ON = "03-03-2022"

[PROJECT]
PROJECT_TITLE = "Multiplatform plasma metabolic and lipid fingerprinting of breast cancer: a pilot control-case study in Colombian Hispanic women."
PROJECT_SUMMARY = "In this pilot study, a metabolomic approaches was performed to establish a plasma metabolic fingerprint of Colombian Hispanic women with breast cancer. Data from NMR, GC-MS and LC-MS were combined and compared."
INSTITUTE = "Universidad de los Andes, Colombia"
DEPARTMENT = "Chemistry"
LAST_NAME = "Cala"
FIRST_NAME = "Monica"
ADDRESS = "Cra. 1 #18a-12"
EMAIL = "mp.cala10@uniandes.edu.co"
PHONE = "+571 3394949"
DOI = "http://dx.doi.org/10.21228/M8QM3R"

[STUDY]
STUDY_TITLE = "Plasma metabolic fingerprint for breast cancer (MS) - part I"
STUDY_TYPE = "control - case"
STUDY_SUMMARY = "Breast cancer is a highly heterogeneous disease associated with metabolic reprogramming. The shifts in the metabolome caused by breast cancer still lack data from Latin populations of Hispanic origin. In this pilot study, metabolomic and lipidomic approaches were performed to establish a plasma metabolic fingerprint of Colombian Hispanic women with breast cancer. NMR, GC-MS and LC-MS datasets were combined and compared. Statistics showed discrimination between breast cancer and healthy subjects on all analytical platforms."
