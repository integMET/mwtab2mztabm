[COLLECTION]
COLLECTION_SUMMARY = "In total, 208 patients with lung cancer were selected from 222 patients with non–small-cell lung cancer (NSCLC) with serum available in the CARET repository from blood draws that occurred up to 12 months before diagnosis. Fourteen patients with insufficient sample available for the study were excluded.Two control individuals who were free of lung cancer were matched to each patient case on age at baseline (5-year groups), sex, baseline smoking status (current v former), and study enrollment phase (pilot [1985 to 1988] or full-scale trial [1989 to 1994], thus accounting for sample storage time). For one patient, only a single control could be matched, resulting in a total of 208 patients and 415 controls included in the study. The samples were divided into two sets; samples from 100 matched sets were used for biomarker discovery (the discovery set), and the remaining 108 matched sets were reserved for validation of markers identified by the discovery efforts (the validation set). All CARET participants provided informed consent at recruitment and throughout follow-up, and the institutional review boards at each of the six study centers approved all study procedures."
COLLECTION_PROTOCOL_FILENAME = "JCO-2015-Wikoff-3880-6.pdf"
SAMPLE_TYPE = "Blood"
BLOOD_SERUM_OR_PLASMA = "Plasma"

[TREATMENT]
TREATMENT_SUMMARY = "Potential confounders and effect modifiers on the DAS and lung cancer association were examined by the Mann-Whitney U test or Kruskal-Wallis test, stratified by case-control status, to assess association between DAS and several potential confounders, including sex, age, fasting time (hours since last meal), body mass index, smoking status (current v former), pack-years, and CARET exposure population (asbestos-exposed v heavy smoker cohort), as well as histology, stage of disease, and time of blood draw with respect to diagnosis (0 to 6 months v 6 to 12 months prior) among patients with lung cancer only."
TREATMENT_PROTOCOL_FILENAME = "JCO-2015-Wikoff-3880-6.pdf"
HUMAN_FASTING = "0-30 Hours"

[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "1. Switch on bath to pre-cool at –20°C (±2°C validity temperature range) 2. Gently rotate or aspirate the blood samples for about 10s to obtain a homogenised sample. 3. Aliquot 30µl of plasma sample to a 1.0 mL extraction solution. The extraction solution has to be prechilled using the ThermoElectron Neslab RTE 740 cooling bath set to -20°C. 4. Vortex the sample for about 10s and shake for 5 min at 4°C using the Orbital Mixing Chilling/Heating Plate. If you are using more than one sample, keep the rest of the sample on ice (chilled at <0°C with sodium chloride). 5. Centrifuge samples for 2min at 14000 rcf using the centrifuge Eppendorf 5415 D. 6. Aliquot two 450µL portions of the supernatant. One for analysis and one for a backup sample. Store the backup aliquot in -20°C freezer. 7. Evaporate one 450µL aliquots of the sample in the Labconco Centrivap cold trap concentrator to complete dryness. 8. The dried aliquot is then re-suspended with 450 µL 50% acetonitrile (degassed as given above). 9. Centrifuged for 2 min at 14000 rcf using the centrifuge Eppendorf 5415. 10. Remove supernatant to a new Eppendorf tube. 11. Evaporate the supernatant to dryness in the Labconco Centrivap cold trap concentrator. 12. Submit to derivatization."
SAMPLEPREP_PROTOCOL_FILENAME = "SOP_blood-GCTOF-11082012.pdf"

