[PROJECT]
PROJECT_TITLE = "Metabolic Profiling of Visceral and Subcutaneous Adipose Tissue from Colorectal Patients: Unraveling the Link Between Adipose Tissue and Cancer"
PROJECT_TYPE = "biomarker study"
PROJECT_SUMMARY = "This West Coast Metabolomics Center pilot and feasibility project was granted Johanna Lampe (Fred Hutchinson Cancer Research Center at Univ. of Washington, In the current investigation, unbiased profiling of the metabolome and lipidome adipose tissue samples (visceral(VAT) and subcutaenous (SAT)) and serum of 50 patients, including stages I-IV, from the Fred Hutchinson Cancer Center and the German Cancer Research Center (Heidelberg, Germany) was conducted. The and metabolome of adipose tissue (VAT/SAT) and serum were analyzed using UPLC-QTOFMS analysis and GC-TOFMS analyses, respectively. The primary of this project were to 1) compare the metabolome and lipidome of matched VAT SAT adipose tissue of n=50 Colorectal Cancer Cell (CRC) patients, 2) the associations between the lipidome and metabolome in adipose tissue and serum of n=50 CRC patients and 3) test the associations between the of VAT and serum with the tumor stage of CRC patients."
