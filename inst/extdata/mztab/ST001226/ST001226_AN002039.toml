[STUDY]
STUDY_TITLE = "Aquamin and Prevention of Colon Cancer (part-II)"
STUDY_TYPE = "MS analysis"
STUDY_SUMMARY = "We propose to evaluate microbial and metabolic profiles in baseline and endpoint colonic mucosal, fecal, and serum samples from human patients at risk for CRC and enrolled in a 90-day phase I clinical trial. Patients will receive daily supplementation with calcium alone, a calcium-rich multimineral (Aquamin?), or placebo (maltodextrin) (n=10 per group). We hypothesize that dietary supplementation will correlate with CRC-protective metabolic profiles and that multimineral supplementation will generate more favorable profiles than calcium supplementation alone."
INSTITUTE = "University of Michigan"
DEPARTMENT = "Biomedical Research Core Facilities"
LABORATORY = "Metabolomics core"
LAST_NAME = "Kachman"
FIRST_NAME = "Maureen"
ADDRESS = "Ann Arbor, MI"
EMAIL = "mkachman@med.umich.edu"
PHONE = "734-232-0842"
NUM_GROUPS = "24"
TOTAL_SUBJECTS = "18"
STUDY_COMMENTS = "Colorectal cancer (CRC) is the third most common cancer and the second leading cause of cancer related death when both genders are combined. Epidemiologically, calcium intake has been protective against colonic adenomas and even colon cancer. Calcium supplementation has reduced the risk of colon adenoma formation in subjects with a history of previous colon polyps. The utility of calcium supplementation for colon cancer prevention is somewhat modulated by the modest or inconsistent level of protection afforded. Our preliminary data in mice and human enterocyte models shows that dietary supplementation with a multimineral supplement (Aquamin?) containing calcium in combination with 72 measureable trace minerals is more protective against tumors and epithelial growth dysregulation than calcium alone. One potential mechanism, supported by our rodent data, is that multimineral supplementation alters gut microbial populations to generate bile acid and short chain fatty acid (SCFA) profiles that are CRC-protective."

