[PROJECT]
PROJECT_TITLE = "Uniquely Tumor-Selective Englerin A Profoundly Alters Lipid Metabolism in Renal Cell Carcinoma inducing ER-Stress and an Acute Inflammatory Response"
PROJECT_TYPE = "Cancer cell"
PROJECT_SUMMARY = "Renal cell carcinoma (RCC) is among the top ten most common forms of cancer and is the most common malignancy of the kidney. Screening of plant extracts in search of new anti-cancer agents resulted in the discovery of englerin A, a guaiane sesquiterpene with potent cytotoxicity against renal cancer cells and a small subset of other cancer cells. the current study used a systems biology approach to explore the mechanism(s) of action of engerin A at a more global level.Our metabolomics analyses indicated that englerin A profoundly altered lipid metabolism in cc-RCC cell lines and generated significant levels of ceramides that were highly toxic to these cells. Microarray analyses determined that englerin A induced ER stress signaling and an acute inflammatory response, which was confirmed by quantitative PCR and Western Blot analyses.Our findings suggest that cc-RCC is highly sensitive to disruptions in lipid metabolism and ER stress and that these vulnerabilities can be targeted for the treatment of cc-RCC and possibly other lipid storing cancers."
