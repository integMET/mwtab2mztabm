[COLLECTION]
COLLECTION_SUMMARY = "Cell extracts were obtained by the addition of 1 ml of ice-cold methanol:water (80:20) to each dish followed by scraping cells into 1.7ml Eppendorf tubes and vortexing vigorously for 30 sec. A 50 ul aliquot of sample was removed for the picogreen DNA assay for purposes of biomass normalization, and the remaining sample was kept at -80˚C until ready for metabolomic analysis."

[TREATMENT]
TREATMENT_SUMMARY = "A498 cells were plated in 100mm dishes at 0.5 x 106 and 1 x 106 cells/dish in complete RPMI for control and treated cells, respectively. The following day, cells were refed with complete RPMI containing 0.1% DMSO or 100 nM englerin A in DMSO with each condition being conducted in quadruplicate. Cells were incubated with vehicle or englerin A for 24 or 48 h and then they were snap frozen with liquid nitrogen."
TREATMENT = "Anticaner drug"
TREATMENT_COMPOUND = "Englerin A"
TREATMENT_ROUTE = "Direct incubation"
TREATMENT_DOSE = "100 nM"
TREATMENT_DOSEDURATION = "24hr and 48hr"

[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "Typically, 300 µl of cells in methanol:water (80:20) was thawed on ice and transferred to a 1.7 ml Eppendorf tube. Five µl of a cocktail containing 25-35 commercial stable isotope internal standards, and 5.0 µl of 57 stable isotope internal standards that were custom-synthesized in E. coli and S. cerevisiae by metabolic labeling with 13C-glucose, and 13C-bicarbonate, were added, and vortexed vigorously for 30 sec. Macromolecules (protein, DNA, RNA, glycans, etc.) then were removed by centrifugation at 16,000g x 10 min at 4˚C. The supernatants containing the extracted metabolites and internal standards were transferred to labeled cryotubes and stored at -80˚C for LC-MS/MS analysis."
