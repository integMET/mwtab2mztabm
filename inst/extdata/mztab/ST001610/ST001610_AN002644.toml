[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "5 × 106 A549 cells were treated with or without DRB18 for 48 hours. After treatment, cells were washed twice with deionized water and polar metabolites were then extracted with cryogenically cold 80% methanol/water mixture. LC-MS grade water, methanol, and acetonitrile (Fischer Scientific, PA, USA) were used. Methanol-extracted samples were then sonicated in cycles of sonication phase and rest phase for 10 minutes (5 second sonication phase and 10 seconds halt). The samples were then centrifuged at 13,000 rpm for 10 minutes and supernatant was then collected. Supernatants collected from in vitro and in vivo extraction were then lyophilized. Briefly, the supernatant was then lyophilized by using a speed vaccum evaporator. The samples were then dissolved into a mixture of acetonitrile/water (1:1; v/v)."
PROCESSING_METHOD = "Quenching"
PROCESSING_STORAGE_CONDITIONS = "-80℃"
EXTRACTION_METHOD = "Quenching with Ice cold methanol"
EXTRACT_ENRICHMENT = "Speed vaccum evaporator"
EXTRACT_STORAGE = "-80℃"
SAMPLE_RESUSPENSION = "Acetonitrile/waster (1:1)"

[CHROMATOGRAPHY]
CHROMATOGRAPHY_SUMMARY = "The entire LC/MS-MS experiment was performed in the Campus Chemical Instrumentation Center’s Mass Spectrometry and Proteomics facility at The Ohio State University. Lyophilized samples were dissolved in equal amounts of LC-MS grade water and acetonitrile and run with LC/MS-MS analysis, using an untargeted metabolomics approach by utilizing Agilent Q-TOF 6545 mass spectrometer connected to an Agilent 1290 UHPLC system with a Poroshell 120 SB-C18 (2 x 100 mm, 2.7 µm particle size) column. The LC gradient consisted of solvent A, H2O with 0.1 % Formic acid, and solvent B, 100 % acetonitrile at a 200 µL/min flow rate with an initial 2 % solvent B with a linear ramp to 95 % B at 15 min, holding at 95% B for 1 minutes, and back to 2 % B from 16 min and equilibration of 2 % B until min 32. A 5 µL volume sample was injected for each run and the top 5 ions were selected for data-dependent analysis with a 15 second exclusion window."
CHROMATOGRAPHY_TYPE = "Reversed phase"
INSTRUMENT_NAME = "Agilent 1290"
COLUMN_NAME = "Poroshell 120 SB-C18 (2.1 x 100 mm x 2.7 Âµm)"
FLOW_GRADIENT = "an initial 2 % solvent B with a linear ramp to 95 % B at 15 min, holding at 95% B for 1 minutes, and back to 2 % B from 16 min and equilibration of 2 % B until min 32."
FLOW_RATE = "200 µL/min"
COLUMN_TEMPERATURE = "40"
SOLVENT_A = "H2O with 0.1 % Formic acid"
SOLVENT_B = "100 % acetonitrile"
COLUMN_PRESSURE = "800 bar"
SAMPLE_INJECTION = "5 µL"
CAPILLARY_VOLTAGE = "500 V"

