[COLLECTION]
COLLECTION_SUMMARY = "DIPG IV and DIPG XVII cell lines are collected in this experiment. Susupension cells are harvested using centrifugation at 1200 rpm for 5 min. 1 mL of the supernatant media werr collected in an eppendorf tube and snapped frozen. The cell pellets were broken up into single cell suspension and counted. 1 million cells were taken from the stock and washed 1 x with PBS using table top centrifuge with 10 sec quick spin. The resulting cell pellet was snap frozen. Both the frozen media and cell pellet are stored in -80 C prior transfer."
SAMPLE_TYPE = "Glioma cells"

[TREATMENT]
TREATMENT_SUMMARY = "Glutamine is required for survival in H3K27M cell lines. DIPG cell lines with the H3K27M mutation were grown in regular media (45mM glucose + 4.5 mM glutamine), glutamine (Gln) free media, and Gln free media with alpha-ketoglutarate (α-KG). Study Design Factors IV REG / GF / aKG = DIPG IV celline grown in regular media / glutamine free media / glutamine free meida with alpha-ketoglutarate XVII REG / GF / aKG = DIPG XVII celline grown in regular media / glutamine free media / glutamine free meida with alpha-ketoglutarate"

