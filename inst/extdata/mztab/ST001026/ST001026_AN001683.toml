[PROJECT]
PROJECT_TITLE = "Mayo Pilot and Feasibility: H3K27M cells and glutamine metabolomics quatitation studies"
PROJECT_SUMMARY = "In children, tumors affecting the brain and nervous system result in more cancer-related deaths than any other type of tumor. It is thus critical to identify new approaches for therapy. Among pediatric patients, one of the most devastating brain tumor types is Diffuse Intrinsic Pontine Gliomas (DIPG). Our understanding of this deadly disease has recently been advanced by important discoveries, including the discovery that the majority of DIPG tumors harbor the histone H3K27M mutation. This mutation results in global hypomethylation of H3K27 residues and is the pathological hallmark for this disease. Glutamine (Gln) addiction has been reported in many cancers including malignant adult gliomas. Glutamine likely promotes cancer cell proliferation and survival likely through generation of the TCA cycle intermediate alpha-ketoglutarate (α-KG). Importantly, α-KG is a critical co-factor for histone lysine demethylases including JMJD3, the enzyme responsible for removing the methyl groups from H3K27me3. Our preliminary data shows H3K27M tumor cells require Gln for survival, and if Gln is removed from the culture media, cells can be rescued by the addition of α-KG. Furthermore, Gln deprivation leads to an increase in H3K27 trimethylation similar to direct inhibition of JMJD3. It is for these reasons we hypothesize that H3K27M tumors are dependent on Gln derived α-KG both for feeding the TCA cycle and for further decreasing H3K27 trimethylation. Inhibition of Gln metabolism will likely uncover novel therapeutic targets for this deadly disease. In Aim 1 we will study Gln and glucose metabolism in H3K27M tumor cells and compare this to Wild Type (WT) tumors and Embryonic Stem Cells (ESCs). In Aim 2 we will validate the therapeutic validity of inhibiting Gln metabolism in H3K27M tumors."
