[PROJECT]
PROJECT_TITLE = "Tobacco-specific carcinogens induce hypermethylation, DNA adducts and DNA damage in Bladder Cancer"
PROJECT_SUMMARY = "Smoking is a major risk factor for the development of Bladder cancer (BCa); however, the metabolic alterations and functional consequences associated with cigarette smoke carcinogens in BCa remain poorly defined. We assessed the metabolic profile in BCa and identified the key alterations in metabolism associated with smoking."
INSTITUTE = "Baylor College of Medicine"
