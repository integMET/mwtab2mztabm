[STUDY]
STUDY_TITLE = "Tobacco-specific carcinogens in Bladder Cancer"
STUDY_SUMMARY = "Smoking induced methylation plays a critical role in the accumulation of methylated metabolites, DNA adducts damage and altered metabolism in BCa. These deregulated metabolites can be detected non-invasively and can be used as causal biomarkers that can predict the risk of developing BCa in smokers"
INSTITUTE = "Baylor College of Medicine"
