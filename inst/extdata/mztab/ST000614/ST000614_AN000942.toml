[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "All the tissues and urine samples used for this study were stored in -140oC. 50 mg of tissue was used for the extraction. For cell lines, 3 x106 cell pellets were thawed at 4 °C and subjected to three freeze-thaw cycles, freezing in liquid nitrogen and thawing on ice, to rupture the cell membranes. The extraction step start with 750 µL ice-cold methanol:water (4:1) containing 20 µL spiked internal standards was added to each cell pellet or tissue sample. Ice-cold chloroform and water was added in a 3:1 ratio for a final proportion of 1:4:3:1 water:methanol:chloroform:water. The organic (methanol and chloroform) and aqueous layers dried and re suspended with 50:50 methonal: water. The extract was deproteinized using a 3-kDa molecular filter (Amicon Ultracel-3K Membrane; Millipore Corporation, Billerica, MA) and the filtrate was dried under vacuum (Genevac EZ-2plus; Gardiner, Stone Ridge, NY). Prior to mass spectrometry, the dried extracts were resuspended in identical volumes of injection solvent composed of 1:1 water:methanol and subjected to liquid chromatography-mass spectrometry. 50 ul of urine was used for sample preparation. Internal standard was spiked into raw sample. Then it was processed through Amicon 3k filter. After that, 50 ul of urine sample was diluted with 450 solvent ( methanol water =50:50 v/v) and subjected to LC/MS analysis. The injection volume was 10 ul."

[CHROMATOGRAPHY]
