[PROJECT]
PROJECT_TITLE = "Colorectal Cancer Detection Using Targeted Serum Metabolic Profiling"
PROJECT_SUMMARY = "Colorectal cancer (CRC) is one of the most prevalent and deadly cancers in the Despite an expanding knowledge of its molecular pathogenesis during the past decades, robust biomarkers to enable screening, surveillance, and therapy of CRC are still lacking. In this study, we present a targeted liquid mass spectrometry-based metabolic profiling approach for identifying biomarker that could enable highly sensitive and specific CRC detection using human serum In this targeted approach, 158 metabolites from 25 metabolic pathways of significance were monitored in 234 serum samples from three groups of patients CRC patients, 76 polyp patients, and 92 healthy controls). Partial least analysis (PLS-DA) models were established, which proved to be powerful for CRC patients from both healthy controls and polyp patients. Receiver operating curves generated based on these PLS-DA models showed high sensitivities (0.96 0.89, respectively, for differentiating CRC patients from healthy controls or patients); good specificities (0.80 and 0.88), and excellent areas under the (0.93 and 0.95) were also obtained. Monte Carlo cross validation (MCCV) was applied, demonstrating the robust diagnostic power of this metabolic profiling"
INSTITUTE = "University of Washington"
DEPARTMENT = "Anesthesiology and Pain Medicine"
LABORATORY = "Northwest Metabolomics Research Center"
