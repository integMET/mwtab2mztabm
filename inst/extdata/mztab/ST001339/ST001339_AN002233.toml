[PROJECT]
PROJECT_TITLE = "Disruption of Redox Balance Enhances the Effects of BRAF-inhibitors in Melanoma"
PROJECT_TYPE = "Untargeted-Targeted Metabolomics analysis"
PROJECT_SUMMARY = "Melanomas harboring BRAF mutations can be treated with BRAF inhibitors, but tumor recurrence is inevitable. In spite of large-scale attempts, there remains an unmet need to uncover molecular determinants of BRAFi insensitivity and devise actionable combination targets to overcome resistance. Here, using an integrative approach of experimentation, and mathematical flux balance analyses in a panel of BRAF-mutated melanoma cells, we show that elevated antioxidant capacity of melanoma cells is linked to their drug sensitivity. Specifically, we report that drug-insensitive melanoma cells can maintain higher levels of antioxidant metabolites to withstand the lethal effects of drugs. By extending our analysis to other melanoma subtypes in the TCGA, we show that elevated redox capacity could indeed be a general feature of melanoma. Our results suggest that redox vulnerabilities could be exploited for therapeutic benefits and identify unsuspected combination targets to enhance the effects of BRAFi in pan-melanoma."
