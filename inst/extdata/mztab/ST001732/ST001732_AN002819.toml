[SUBJECT]
SUBJECT_TYPE = "Cultured cells"
SUBJECT_SPECIES = "Homo sapiens"
TAXONOMY_ID = "9606"

[COLLECTION]
COLLECTION_SUMMARY = "NCI/ADR-RES cells were verified to be of ovarian origin by genotyping. All cancer cell lines were maintained in RPMI 1640 (Sigma R8758) containing glucose (2 mg/ml) and glutamine (0.6 mg/ml) but no pyruvate and was supplemented with 5% Fetal calf serum."
SAMPLE_TYPE = "Cultured cells"

[TREATMENT]
TREATMENT_SUMMARY = "Cells were cultured under normal conditions, detached using trypsin-EDTA (0.05 %), counted, normalized to 0.5 x 106 in each sample, and then cell pellets were snap frozen in liquid nitrogen prior to analysis. To determine the effect of N-MCJ mimetic treatment, equal numbers of NCI/ADR-RES cells were plated and allowed grow for 2 d followed by the addition of vehicle or MITOx30 (25 μM) for 12 h. Cells were then collected and processed as above."

[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "Metabolomics and flux analyses were performed as previously reported 31,61. Briefly, 2 x 106 cells and 20 μl of cell media were extracted in 1 mL and 980 μL of cold lysis and extraction buffer (methanol : acetonitrile : water, 5:3:2), respectively."

[CHROMATOGRAPHY]
CHROMATOGRAPHY_SUMMARY = "Positive Mode 10 μL of water and methanol soluble fractions were run through a Kinetex C18 1.7 μm, 100 x 2.1 mm (Phenomenex) reversed phase column (Positive ion mode - phase A: water, 0.1 % formic acid; B: acetonitrile, 0.1 % formic acid) via an ultra-high performance chromatographic system (UHPLC - Vanquish, Thermo Fisher). UHPLC was coupled in line with a high-resolution quadrupole Orbitrap instrument run in positive polarity mode (QExactive, Thermo Fisher) at 70,000 resolution (at 200 m/z). Gradients and other technical parameters and the variants employed herein have been extensively described."
CHROMATOGRAPHY_TYPE = "Reversed phase"
