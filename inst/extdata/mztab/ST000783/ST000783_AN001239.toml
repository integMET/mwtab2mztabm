[PROJECT]
PROJECT_TITLE = "Serum metabolomics study of prostate cancer for african american"
PROJECT_SUMMARY = "We studied the metabolome in a group of AA and EA of prostate cancer and case control plasma."
INSTITUTE = "Baylor College of Medicine"
LAST_NAME = "Sreekumar"
FIRST_NAME = "Arun"
ADDRESS = "One Baylor Plaza, Houston, TX, 77030, USA"
EMAIL = "Arun.Sreekumar@bcm.edu"
PHONE = "713-798-3305"

[STUDY]
STUDY_TITLE = "Absolute Quantification of 180 metabolites in serum from african american and european american in prostate cancer and case control samples"
STUDY_SUMMARY = "Metabolite concentrations were obtained in prostate cancer and case control plasma samples from AA and EA individuals using the AbsoluteIDQ kit p180 (Biocrates Life Science AG, Austria) according to the manufacturer’s instructions. The analysis was performed using a QTRAP 6500 LC/MS/MS System (AB SCIEX, USA) equipped with an electrospray ionization source, Agilent G1367B autosampler and the Analyst 1.51 software (AB SCIEX, USA)."
INSTITUTE = "Baylor College of Medicine"
LAST_NAME = "Sreekumar"
FIRST_NAME = "Arun"
ADDRESS = "One Baylor Plaza, Houston, TX, 77030, USA"
EMAIL = "Arun.Sreekumar@bcm.edu"
PHONE = "713-798-3305"

[SUBJECT]
SUBJECT_TYPE = "human"
SUBJECT_SPECIES = "Homo sapiens"
TAXONOMY_ID = "9606"

[COLLECTION]
COLLECTION_SUMMARY = "Clinically annotated ancestry verified serum samples from the National Cancer Institute."

[TREATMENT]
TREATMENT_SUMMARY = "NA"

[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "Briefly, 10 μl of undiluted plasma sample from each patient or control individual was placed in individual wells of a 96 well plate provided by the manufacturer. Samples were dried at room temperature using a nitrogen evaporator drying unit for 30 mins. Following this, 20 μl of 5% phenylisothiocyanate (PITC) reagent was added to the dried plasma spots and incubated for 20 min at RT. The plate was again dried under the nitrogen evaporator for 60 mins. Next, 300 μl of 5 mM ammonium acetate in methanol was added to each well and the mixture was incubated on a shaker (450 rpm) for 30 mins. The plate was then centrifuged at 100 g for 2 min resulting in a volume of ~ 250 μl sample in the plate (labeled as Flow injection or FIA plate). 150 μl of the sample was subsequently transferred from the FIA plate into a second plate (termed LC-MS plate). In total, all the samples were analyzed in three batches, each containing one FIA and LC-MS plate, respectively. 150 μl HPLC grade water was added to the LC-MS plate to make up the volume to 300 ul. In parallel, 500 μl of mass spectrometry injection solvent (stock solution provided by Biocrates was diluted in methanol) was added to the FIA plate. The LC-MS plate was analyzed using Multiple Reaction Monitoring post LC-MS fractionation. The FIA plate was stored at 4°C until the LC-MS plate was completed assayed."

[CHROMATOGRAPHY]
CHROMATOGRAPHY_SUMMARY = "Flow injection coupled to MRM was used to measure mono-unsaturated glycerophosphophocholines in samples in the FIA plate. For flow injection analysis, 20 μl of sample was injected directly into the MS at a flow rate of 30 μl/min in mobile phase."
CHROMATOGRAPHY_TYPE = "None (Direct infusion)"
INSTRUMENT_NAME = "None"
COLUMN_NAME = "none"

[ANALYSIS]
ANALYSIS_TYPE = "MS"

[MS]
MS_COMMENTS = "-"
INSTRUMENT_NAME = "AB Sciex 6500 QTRAP LC-MS/MS"
INSTRUMENT_TYPE = "Triple quadrupole"
MS_TYPE = "ESI"
ION_MODE = "POSITIVE"

[MS_METABOLITE_DATA]
Units = "uM"

