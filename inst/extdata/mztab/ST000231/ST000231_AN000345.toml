[PROJECT]
PROJECT_TITLE = "Comprehensive analysis of transcriptome and metabolome analysis in Intrahepatic and Hepatocellular Carcinoma"
PROJECT_TYPE = "Population Genetics for comparison between cholangiocarcinoma and carcinoma"
PROJECT_SUMMARY = "Intrahepatic cholangiocarcinoma (ICC) and hepatocellular carcinoma (HCC) are originated malignant tumors. The prognosis of ICC is generally worse than that HCC because there is lack of early diagnostic marker for ICC and the mechanism of ICC is not fully understood. So our aim was to perform metabolome transcriptome analysis to reveal the carcinogenetic mechanism and to detect an diagnostic marker for ICC Ten ICC and 6 HCC which were resected surgically, enrolled. miRNA and mRNA expression analysis were performed by microarray on and HCC and their corresponding non-tumor tissues (ICC_NT and HCC_NT). Compound was performed using capillary electrophoresis time-of-flight mass spectrometry Principle component analysis (PCA) revealed that our four sample groups ICC_NT, HCC, and HCC_NT) have 14 compounds, 62 mRNAs and 17 miRNAs with expressive patterns. There were two distinct patterns among the 4 groups; one tumor and non-tumor, the other is ICC and non-ICC. To clarify the biological of individual genes and compounds, we performed pathway analysis. ICC formation related to RNA synthesis, amino acid synthesis, and glucose-lipid synthesis ICC was classified by distinct pattern of compounds with high accuracy PCA revealed that several pathways were associated with the development of and distinguished ICC from other diseases. These findings are a promising step establishing novel biomarkers that can be clinically applicable."
