SAMPLE_TYPE = "Cultured cells"

[TREATMENT]
TREATMENT_SUMMARY = "MCF7 cell transfections were performed using siPORT NeoFX Transfection Agent (ThermoFisher Scientific) following the recommended protocol for an oligonucleotide siRNA based on the previously described MCJ targeting sequence."

[SAMPLEPREP]
SAMPLEPREP_SUMMARY = "All cancer cell lines were maintained in RPMI 1640 (Sigma R8758) containing glucose (2 mg/ml) and glutamine (0.6 mg/ml) but no pyruvate and was supplemented with 5% Fetal calf serum. Metabolic profile comparisons of cells were performed on equal cell numbers. Cells were cultured under normal conditions, detached using trypsin-EDTA (0.05 %), counted, normalized to 0.5 x 10e6 in each sample, and cell pellets were snap frozen in liquid nitrogen prior to analysis. Briefly, 2 x 10e6 cells and 20μL cell media were extracted in 1mL and 980μL cold lysis and extraction buffer (methanol : acetonitrile : water, 5:3:2), respectively, and pellets were discarded."

[CHROMATOGRAPHY]
CHROMATOGRAPHY_SUMMARY = "Positive Mode 10 μL of water and methanol soluble fractions were run through a Kinetex C18 1.7 μm, 100 x 2.1 mm (Phenomenex) reversed phase column (Positive ion mode - phase A: water, 0.1 % formic acid; B: acetonitrile, 0.1 % formic acid) via an ultra-high performance chromatographic system (UHPLC - Vanquish, Thermo Fisher). UHPLC was coupled in line with a high-resolution quadrupole Orbitrap instrument run in positive polarity mode (QExactive, Thermo Fisher) at 70,000 resolution (at 200 m/z). Gradients and other technical parameters and the variants employed herein have been extensively described."
CHROMATOGRAPHY_TYPE = "Reversed phase"
